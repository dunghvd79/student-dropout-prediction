# Cấu hình chung của dự án. Bí mật (mật khẩu, khóa) nằm trong .env, KHÔNG đặt ở đây.

project:
  name: dropout-ews
  random_state: 42

paths:
  source_csv: academic_survival_longitudinal.csv
  data_dir: data
  raw_dir: data/raw
  processed_dir: data/processed
  features_dir: data/features
  splits_dir: data/splits
  models_dir: data/models
  reports_dir: reports
  figures_dir: reports/figures

minio:
  host: localhost
  buckets:
    raw: raw
    processed: processed
    mlflow: mlflow
  raw_prefix: academic

postgres:
  host: localhost

mongo:
  host: localhost
  collection: academic_semesters

mlflow:
  tracking_uri: http://localhost:5000
  experiment: dropout_ews
  model_name: dropout_model

data:
  expected_rows: 79239
  expected_columns: 22
  id_col: Student_ID
  time_col: Semester
  target_col: Target_Dropout_Next_Sem
  censored_col: Censored
  leakage_cols: [End_of_Semester_Status, Censored]

split:
  test_size: 0.2
  cv_folds: 5

model:
  primary_metric: average_precision   # PR-AUC
  # Quyết định của nhóm (B11, xác nhận lại ở B13 sau khi sửa rò rỉ Income_Missing): XGBoost nhỉnh hơn 0,003 PR-AUC
  # (3 seed × 5 fold) nhưng chênh không đáng kể thực tế → giữ LogReg vì đơn giản, giải thích chính xác.
  final: logreg

risk_levels:
  # CHÍNH SÁCH (nhóm chốt ở B12). Mốc xác suất cụ thể được B12 tính trên dự đoán out-of-fold của Train
  # và ghi vào config/risk_thresholds.json (B14 đọc file đó), không đặt cứng ở đây.
  #   Trung bình: ngưỡng LỚN NHẤT vẫn đạt Recall >= target_recall  → bắt đủ 80% ca bỏ học (theo dõi / email)
  #   Cao       : ngưỡng NHỎ NHẤT đạt Precision >= high_precision  → ít nhất 1/2 cảnh báo là đúng (liên hệ trực tiếp)
  target_recall: 0.80
  high_precision: 0.50

monitoring:
  # Ngưỡng cảnh báo của B16 (src/ops/monitor.py). Vượt ngưỡng → ghi vào pipeline_runs.alerts và báo cáo.
  max_pipeline_seconds: 120          # toàn pipeline hằng tuần (không gồm huấn luyện lại)
  max_schema_error_rate: 0.001       # 0,1% dòng sai kiểu / thiếu ở cột bắt buộc
  max_missing_rate: 0.10             # Family_Income, LMS_Logins (hiện 4,5% và 1,1%)
  psi_features: [Sem_GPA, Financial_Stress, Attendance]
  psi_warn: 0.10                     # 0,1 – 0,2: theo dõi
  psi_alert: 0.20                    # > 0,2: cân nhắc huấn luyện lại
  max_metric_drop: 0.05              # Recall / PR-AUC trên nhãn mới giảm > 5 điểm so với lúc triển khai
  high_share_tolerance: 0.5          # tỷ lệ mức Cao lệch > 50% (tương đối) so với Test

backup:
  dir: backups                       # không commit (.gitignore)
  keep: 4                            # giữ 4 bản gần nhất
